name: Generate city maps (Gemini AI)
on:
  workflow_dispatch:
    inputs:
      codes:
        description: 'City codes, space-separated'
        default: 'SEO'
      km:
        description: 'Map side in km'
        default: '25'
      limit:
        description: 'Maximum cities (1–10)'
        default: '1'
      rounds:
        description: 'AI draft/review rounds (1–3)'
        default: '3'
      model:
        description: 'Gemini API model ID'
        default: 'gemini-3.8-flash'
permissions:
  contents: read
concurrency:
  group: city-maps
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: .map-cache
          key: map-pbf-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            map-pbf-cache-v1-
      - name: Install local OSM tools
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - run: pip install -r map_auto/requirements.txt
      - name: Test local map adapter
        run: cd map_auto && python -m unittest -v test_pbf_source
      - name: Build with Gemini
        env:
          PBF_URL: ${{ vars.PBF_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model }}
          CODES: ${{ inputs.codes }}
          KM: ${{ inputs.km }}
          LIMIT: ${{ inputs.limit }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          read -r -a codes <<< "$CODES"
          python map_auto/ai_agent.py --km "$KM" --limit "$LIMIT" --rounds "$ROUNDS" --codes "${codes[@]}"
      - name: Save partial map data
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .map-cache
          key: map-pbf-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: city-map-drafts
          path: generated_maps/
          if-no-files-found: warn
